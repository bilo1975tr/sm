name: Deep Stream Validator (10-20 Hours Chunking)

on:
  schedule:
    - cron: '0 * * * *'  # Her saat başı tetiklenir, script içindeki cooldown ve chunking (50 dk limit) ile yönetilir
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Deep Stream Validator Worker
        run: |
          python3 scripts/deep_stream_validator.py

      - name: Commit Validator State and Output Playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/validator_state.json || true
          if [ -f "out/full_cleaned_playlist.m3u" ]; then
            git add out/full_cleaned_playlist.m3u || true
          fi
          if ! git diff --staged --quiet; then
            git commit -m "chore(validator): update deep stream validation state [skip ci]" || true
            git pull --rebase origin HEAD || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi

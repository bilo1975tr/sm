name: Daily M3U Playlist & EPG Auto Update

on:
  schedule:
    # Her gün saat 03:00 UTC (24 saatte bir çalışır)
    - cron: '0 3 * * *'
  workflow_dispatch: # GitHub Actions sekmesinden elle tetikleme imkanı

permissions:
  contents: write # Repoya yeni playlist'i commit edip push edebilmek için gerekli izin

jobs:
  update-playlist:
    name: Clean Playlist & Sync EPG & Logos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run M3U Cleaner & EPG Enricher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_clean_m3u.py --source auto_update.json --outdir . --fetch-logos --remove-dead

      - name: Commit and Push Updated Playlist
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add cleaned_playlist.m3u report.json
          if ! git diff --staged --quiet; then
            git commit -m "auto: Günlük M3U playlist, EPG ve logo güncellemesi [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Değişiklik yok, commit atlanıyor."
          fi

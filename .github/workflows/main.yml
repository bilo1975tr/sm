name: Firebase to GitHub Sync

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı otomatik çalışır
  workflow_dispatch: # Manuel çalıştırmaya izin verir

permissions:
  contents: write

jobs:
  sync_channels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Uzaktaki değişiklikleri birleştirmek için tüm geçmişi indirir

      - name: Fetch and Sync
        run: |
          # 2. Firebase'den çek
          curl -s 'https://streammesh-p2p-default-rtdb.europe-west1.firebasedatabase.app/new_channels.json' > firebase_new.json
          
          # Node.js scripti ile verileri birleştirme ve dillerine göre ayırma
          cat << 'EOF' > process.js
          const fs = require('fs');
          
          let current = [];
          try { current = JSON.parse(fs.readFileSync('channels.json', 'utf8')); } catch(e){}
          
          let firebaseNew = {};
          try { firebaseNew = JSON.parse(fs.readFileSync('firebase_new.json', 'utf8')); } catch(e){}
          
          let newChannels = [];
          if (Array.isArray(firebaseNew)) newChannels = firebaseNew;
          else if (typeof firebaseNew === 'object' && firebaseNew !== null) newChannels = Object.values(firebaseNew);
          
          if (newChannels.length === 0) {
              console.log("No new channels");
              process.exit(0);
          }
          
          const allChannels = [...current, ...newChannels];
          const unique = [];
          const map = new Set();
          for (const c of allChannels) {
              if (!c || !c.Id) continue;
              if (!map.has(c.Id)) {
                  map.add(c.Id);
                  unique.push(c);
              }
          }
          
          fs.writeFileSync('channels.json', JSON.stringify(unique, null, 2));
          
          // Dillerine göre gruplama
          const byLang = {};
          for (const c of unique) {
              let lang = (c.Language || "Bilinmiyor").trim();
              let safeLang = lang.toLowerCase();
              safeLang = safeLang.replace(/[\(\)]/g, '').replace(/[^a-z0-9ığüşöç\s\-]/gi, '').replace(/\s+/g, '_');
              if (!safeLang) safeLang = "bilinmiyor";
              
              if (!byLang[safeLang]) byLang[safeLang] = [];
              byLang[safeLang].push(c);
          }
          
          for (const [lang, channels] of Object.entries(byLang)) {
              fs.writeFileSync(`channels_${lang}.json`, JSON.stringify(channels, null, 2));
              
              let m3u = "#EXTM3U\n";
              for (const c of channels) {
                  let logo = (c.LogoUrl || "").split(',')[0] || "";
                  let src = (c.Url || "").split(',')[0] || "";
                  m3u += `#EXTINF:-1 tvg-id="${c.EpgId || ""}" tvg-name="${c.Name || ""}" tvg-logo="${logo}" group-title="${c.GroupTitle || ""}",${c.Name || ""}\n`;
                  m3u += `${src}\n`;
              }
              fs.writeFileSync(`kanallar_${lang}.m3u`, m3u);
          }
          EOF
          
          node process.js
          
          # Hata verdiyse çıkış yap
          if [ $? -ne 0 ]; then
            echo "Node.js proses hatası!"
            exit 1
          fi

          if [ ! -s firebase_new.json ] || [ "$(cat firebase_new.json)" == "null" ] || [ "$(cat firebase_new.json)" == "{}" ]; then
             echo "SKIP_COMMIT=true" >> $GITHUB_ENV
          fi

      - name: Commit and Push changes
        if: env.SKIP_COMMIT != 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.json channels_*.json kanallar_*.m3u
          
          # 6. Sadece değişiklik varsa Commit at
          if ! git diff --staged --quiet; then
            git commit -m "Saatlik Firebase Senkronizasyonu"
            
            # --- UZAK SUNUCUDAKİ DEĞİŞİKLİKLERİ AL (Çakışma / Error 1 Çözümü) ---
            git pull --rebase origin main
            
            git push
            
            # 7. Push başarılı olduysa Firebase'i temizle
            if [ $? -eq 0 ]; then
              curl -X DELETE 'https://streammesh-p2p-default-rtdb.europe-west1.firebasedatabase.app/new_channels.json'
              echo "Senkronizasyon başarılı, GitHub güncellendi ve Firebase boşaltıldı."
            else
              echo "Push işlemi başarısız oldu!"
              exit 1
            fi
          else
            echo "Herhangi bir değişiklik bulunamadı, commit atlandı."
          fi

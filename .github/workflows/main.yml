name: Firebase to GitHub Sync

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı otomatik çalışır
  workflow_dispatch: # Manuel çalıştırmaya izin verir

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync_channels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Uzaktaki değişiklikleri birleştirmek için tüm geçmişi indirir

      - name: Fetch and Sync
        run: |
          # 2. Firebase'den çek
          curl -s 'https://streammesh-p2p-default-rtdb.europe-west1.firebasedatabase.app/new_channels.json' > firebase_new.json
          
          # Node.js scripti ile verileri birleştirme ve dillerine göre ayırma
          cat << 'EOF' > process.cjs
          const fs = require('fs');
          
          let current = [];
          try { current = JSON.parse(fs.readFileSync('channels.json', 'utf8')); } catch(e){}
          
          let firebaseNew = {};
          try { firebaseNew = JSON.parse(fs.readFileSync('firebase_new.json', 'utf8')); } catch(e){}
          
          let newChannels = [];
          let deletePayload = {};
          if (typeof firebaseNew === 'object' && firebaseNew !== null && !Array.isArray(firebaseNew)) {
              for (const [key, val] of Object.entries(firebaseNew)) {
                  deletePayload[key] = null;
                  newChannels.push(val);
              }
              fs.writeFileSync('delete_payload.json', JSON.stringify(deletePayload));
          } else if (Array.isArray(firebaseNew)) {
              newChannels = firebaseNew;
          }
          
          const map = new Map();
          for (const c of current) {
              if (c && c.Id) map.set(c.Id, c);
          }
          // Yeni gelenler eskinin üzerine yazsın (URL vb. güncellenmesi için)
          for (const c of newChannels) {
              if (c && c.Id) map.set(c.Id, c);
          }
          
          const unique = Array.from(map.values());
          if (unique.length === 0) {
              console.log("No channels to process");
              process.exit(0);
          }
          
          fs.writeFileSync('channels.json', JSON.stringify(unique, null, 2));
          
          // Dillerine göre gruplama
          const byLang = {};
          for (const c of unique) {
              let lang = (c.Language || "Bilinmiyor").trim();
              let safeLang = lang.toLowerCase();
              safeLang = safeLang.replace(/[\(\)]/g, '').replace(/[^a-z0-9ığüşöç\s\-]/gi, '').replace(/\s+/g, '_');
              if (!safeLang) safeLang = "bilinmiyor";
              
              if (!byLang[safeLang]) byLang[safeLang] = [];
              byLang[safeLang].push(c);
          }
          
          for (const [lang, channels] of Object.entries(byLang)) {
              fs.writeFileSync(`channels_${lang}.json`, JSON.stringify(channels, null, 2));
              
              let m3u = "#EXTM3U\n";
              for (const c of channels) {
                  let logo = (c.LogoUrl || "").split(',')[0] || "";
                  let src = (c.Url || "").split(',')[0] || "";
                  m3u += `#EXTINF:-1 tvg-id="${c.EpgId || ""}" tvg-name="${c.Name || ""}" tvg-logo="${logo}" group-title="${c.GroupTitle || ""}",${c.Name || ""}\n`;
                  m3u += `${src}\n`;
              }
              fs.writeFileSync(`kanallar_${lang}.m3u`, m3u);
          }
          EOF
          
          node process.cjs
          
          # Hata verdiyse çıkış yap
          if [ $? -ne 0 ]; then
            echo "Node.js proses hatası!"
            exit 1
          fi

          # Eğer firebase'den yeni kanal gelmediyse ama current'ta varya yine de json/m3u üretildi. 
          # GitHub action'ın commit atması için değişiklik olması yeterli.
          # SKIP_COMMIT mantığını kaldırıyoruz, git diff --quiet'a bırakıyoruz.

      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # nullglob açık kalsın, match olmazsa döngüye girmesin
          shopt -s nullglob
          for f in channels.json channels_*.json kanallar_*.m3u; do
            if [ -e "$f" ]; then
              git add -f "$f"
            fi
          done
          
          # Değişiklik yoksa çık
          if git diff --staged --quiet; then
            echo "Herhangi bir değişiklik bulunamadı, commit atlandı."
            exit 0
          fi
          
          git commit -m "Saatlik Firebase Senkronizasyonu ve Dil Ayrıştırma"
          
          # Uzaktaki değişiklikleri al (rebase ile)
          git pull --rebase origin main || { echo "Git pull rebase failed!"; exit 1; }
          
          # Değişiklikleri gönder
          git push || { echo "Git push failed!"; exit 1; }
          
          # Başarı durumunda Firebase'i temizle
          if [ -f delete_payload.json ]; then
            curl -X PATCH -d @delete_payload.json -H "Content-Type: application/json" 'https://streammesh-p2p-default-rtdb.europe-west1.firebasedatabase.app/new_channels.json'
            echo "Senkronizasyon başarılı, GitHub güncellendi ve işlem gören kanallar Firebase havuzundan silindi."
          else
            curl -X DELETE 'https://streammesh-p2p-default-rtdb.europe-west1.firebasedatabase.app/new_channels.json'
            echo "Senkronizasyon başarılı, GitHub güncellendi ve (fallback) Firebase boşaltıldı."
          fi

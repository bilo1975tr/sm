name: Build and Release StreamMesh

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.cs'
      - '**.xaml'
      - 'StreamMesh.csproj'
      - 'version.txt'
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write    # Required for creating releases and committing updated version.txt

jobs:
  build_release:
    name: Build & Release Windows Application
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Auto-Increment Version
        id: versioning
        shell: powershell
        run: |
          if (Test-Path "version.txt") {
            $raw = (Get-Content -Path "version.txt" -Raw).Trim()
          } else {
            $raw = "0.1.0"
          }
          
          $parts = $raw.Split('.')
          [int]$major = 0
          [int]$minor = 1
          [int]$patch = 0
          
          if ($parts.Length -eq 3) {
            [int]::TryParse($parts[0], [ref]$major) | Out-Null
            [int]::TryParse($parts[1], [ref]$minor) | Out-Null
            [int]::TryParse($parts[2], [ref]$patch) | Out-Null
          } elseif ($parts.Length -eq 2) {
            [int]::TryParse($parts[0], [ref]$major) | Out-Null
            [int]::TryParse($parts[1], [ref]$minor) | Out-Null
          }
          
          $patch += 1
          if ($patch -gt 100) {
            $minor += 1
            $patch = 0
          }
          if ($minor -gt 100) {
            $major += 1
            $minor = 0
          }
          
          $newVersion = "$major.$minor.$patch"
          Set-Content -Path "version.txt" -Value $newVersion
          
          echo "APP_VERSION=$newVersion" >> $env:GITHUB_ENV
          echo "SAFE_VERSION=$newVersion" >> $env:GITHUB_ENV
          Write-Host "New Version: $newVersion"

      - name: Build & Publish Single File Executable
        shell: cmd
        run: |
          dotnet clean -c Release
          dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Create Inno Setup Installer EXE
        shell: powershell
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $isccPath) {
            & $isccPath /DAppVersion="${env:APP_VERSION}" setup.iss
          } else {
            Write-Warning "Inno Setup compiler (ISCC.exe) not found at standard path, trying PATH..."
            iscc /DAppVersion="${env:APP_VERSION}" setup.iss
          }

      - name: Create Portable ZIP Archive
        shell: powershell
        run: |
          $publishPath = "bin\Release\net8.0-windows\win-x64\publish\*"
          Copy-Item -Path "version.txt" -Destination "bin\Release\net8.0-windows\win-x64\publish\"
          $zipPath = "StreamMesh-v${env:SAFE_VERSION}-Portable.zip"
          Compress-Archive -Path $publishPath -DestinationPath $zipPath -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StreamMesh-v${{ env.SAFE_VERSION }}
          path: |
            StreamMesh-Setup-v${{ env.SAFE_VERSION }}.exe
            StreamMesh-v${{ env.SAFE_VERSION }}-Portable.zip

      - name: Commit Updated Version Back to Git
        shell: bash
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          if ! git diff --staged --quiet; then
            git commit -m "bump: Auto-increment version to v${{ env.APP_VERSION }}"
            git fetch origin ${{ github.ref_name }}
            git rebase -X ours origin/${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ env.SAFE_VERSION }}
          name: StreamMesh v${{ env.APP_VERSION }}
          body: |
            🚀 **StreamMesh Otomatik Kurulum ve Yayın Sürümü: v${{ env.APP_VERSION }}**
            
            - **Kurulum Sihirbazı (İstediğiniz yere kurar, yönetici yetkisi gerektirmez):** `StreamMesh-Setup-v${{ env.APP_VERSION }}.exe`
            - **Taşınabilir ZIP Sürümü:** `StreamMesh-v${{ env.APP_VERSION }}-Portable.zip`
          files: |
            StreamMesh-Setup-v${{ env.SAFE_VERSION }}.exe
            StreamMesh-v${{ env.SAFE_VERSION }}-Portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
